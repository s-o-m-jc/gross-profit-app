<!doctype html>
<!-- ★2026-09-26修正(本番のremoveChildクラッシュ対策): lang="en"のままだと、日本語のページを
     ブラウザ(Chrome等)が「翻訳しますか?」と判断して自動翻訳し、Reactの管理下にあるDOMを
     外部から書き換えてしまう。これはReactが把握しているツリーと実DOMの不一致を生み、
     "NotFoundError: Failed to execute 'removeChild'" と全く同じ種類のエラーを引き起こす
     代表的な原因として知られている。lang="ja"の明示とtranslate="no"・notranslateで、
     この経路でのDOM書き換えを予防する。 -->
<html lang="ja" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>My Google AI Studio App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
